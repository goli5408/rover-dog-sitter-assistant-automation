name: Publish The Barking Lot Toolkit
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-toolkit.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for artifact indexing
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
